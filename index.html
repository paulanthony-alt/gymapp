<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <title>Lift</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fixed top bar: rest timer + banners live here -->
  <div id="topbar"></div>

  <!-- Main screen content -->
  <main id="app"></main>

  <!-- Bottom navigation (hidden during an active session) -->
  <nav id="nav" aria-label="Main">
    <button data-screen="today"    class="nav-btn">Today</button>
    <button data-screen="progress" class="nav-btn">Progress</button>
    <button data-screen="history"  class="nav-btn">History</button>
    <button data-screen="settings" class="nav-btn">Settings</button>
  </nav>

  <script src="program.js"></script>
  <script src="app.js"></script>
</body>
</html>
